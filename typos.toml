# typos (https://github.com/crate-ci/typos) configuration. Run: typos
# typos never checks its own config candidates (Cargo.toml, pyproject.toml, typos.toml).
# Only genuine false positives go in [default.extend-words] / [default.extend-identifiers].

[files]
# Check dotfiles too (.github/, .pre-commit-config.yaml), but not git's internals.
ignore-hidden = false
extend-exclude = [
  ".git/",
  # Generated.
  "Cargo.lock",
  "crates/pyroid-core/src/ftfy/tables.rs",
  "crates/pyroid-core/src/filters/tables.rs",
  "crates/pyroid-core/src/metrics/sacrebleu/tables.rs",
  "crates/pyroid-core/src/json_repair/tables.rs",
  "crates/pyroid-core/src/filters/indic_tables.rs",
  # Test data, incumbent fixtures and raw benchmark results: mojibake, confusables, deliberately
  # misspelt and non-English text. Keep in step with the file-fixer excludes in .pre-commit-config.yaml.
  "python/tests/data/",
  "crates/pyroid-core/tests/ftfy_data/",
  "crates/pyroid-core/tests/filters_data/",
  "crates/pyroid-core/tests/metrics_data/",
  # json_repair's own test inputs and its outputs for them, recorded byte for byte.
  "crates/pyroid-core/src/json_repair/testdata/",
  "bench/data/",
  "bench/results/",
  # Charts copied byte for byte from bench/results/ (matplotlib SVGs).
  "docs/assets/*.svg",
  "parity/data/",
  "parity/tests/",
  "parity/pyroid_parity/refs.py",
  "parity/pyroid_parity/strategies.py",
  # cargo-fuzz corpora: arbitrary bytes and generated text, kept exactly as the fuzzers wrote them.
  "fuzz/corpus/",
  "fuzz/arrow/corpus/",
  # Transliteration fixtures: accented and romanised words (caf\u00e9, ...). Typos only; the
  # file-fixer hooks still check this file.
  "python/tests/test_translit.py",
  # The Porter stemmer's suffixes and stems ("iz", "ful", "ative", "agre", "controll") and its tests' words.
  "crates/pyroid-core/src/metrics/rouge/porter.rs",
  "python/tests/test_metrics_rouge.py",
  # Multilingual filter/dedup tests: German, Turkish, Vietnamese ... text and language codes (tha_Thai).
  "python/tests/test_filters_multilingual.py",
  "python/tests/test_dedup_multilingual.py",
  # The sentence-dedup tests' French, German, Russian ... sentences, and URL tests' made-up punycode labels.
  "python/tests/test_sentence_dedup_more.py",
  "python/tests/test_url_more.py",
]

[default.extend-words]
# datatrove's parameter names (line_punct_thr, short_line_thr), kept for drop-in parity.
thr = "thr"
# ISO 15924 script codes in datatrove / FineWeb-2 language codes (ben_Beng).
Beng = "Beng"

[default.extend-identifiers]
# The arro3 Arrow library (github.com/kylebarron/arro3), not a misspelt "arrow".
arro3 = "arro3"

# bench/gates.py names near-duplicate pairs `nd` (not a misspelt "and"). typos matches file types by file name
# only, so this type covers files named gates.py; there is one, and every other word in it is still checked.
[type.bench-gates]
extend-glob = ["gates.py"]

[type.bench-gates.extend-identifiers]
nd = "nd"

# bench/json_repair_bench.py's seeded sample data: the name "Ines" and "caf\u00e9" (an escaped e-acute).
[type.jr-bench]
extend-glob = ["json_repair_bench.py"]

[type.jr-bench.extend-words]
ines = "ines"
caf = "caf"
