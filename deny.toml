# cargo-deny 0.20 configuration: https://embarkstudios.github.io/cargo-deny/
# Run: cargo deny --locked check    (CI: the `supply-chain` job in .github/workflows/ci.yml)

[graph]
# Check every target and feature, not just the host's: wheels ship for Linux, macOS and Windows.
all-features = true

[advisories]
# RustSec vulnerabilities are always errors. Unmaintained crates fail only for direct
# dependencies of the workspace (we can act on those); deep transitive ones are warnings
# that we fix upstream. Unsound advisories fail anywhere in the graph.
unmaintained = "workspace"
unsound = "all"
yanked = "deny"
# Add exceptions as { id = "RUSTSEC-YYYY-NNNN", reason = "..." }, never as bare IDs.
ignore = []

[licenses]
# Allowlist only: anything not listed (including GPL, LGPL, AGPL, MPL, EUPL, SSPL) fails.
# A dual-licensed crate passes when one of its alternatives is listed ("MIT OR GPL-2.0").
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  # Permissive; pyroid itself carries it for a port of CPython's ipaddress parser (see NOTICE).
  "PSF-2.0",
  "Unicode-3.0",
  "Zlib",
]
confidence-threshold = 0.93
# The allowlist is a policy, not an inventory: listing a license no crate uses yet is fine.
unused-allowed-license = "allow"

[licenses.private]
# Workspace crates are `publish = false`; still check them (they are MIT).
ignore = false

[bans]
multiple-versions = "warn"
# `*` version requirements are errors, except path dependencies between our own
# unpublished workspace crates (pyroid-py -> pyroid-core).
wildcards = "deny"
allow-wildcard-paths = true
highlight = "all"

[sources]
# crates.io only: no git dependencies, no other registries.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
