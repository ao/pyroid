# pytest config for the pyroid test suite. It lives next to the tests (not in
# pyproject.toml) so the suite runs the same when python/tests is copied
# elsewhere, e.g. by a downstream packager testing an installed wheel.
[pytest]
minversion = 9.0
# strict_config, strict_markers, strict_parametrization_ids, strict_xfail.
strict = true
addopts = -ra
filterwarnings =
    error
    # jieba 0.42.1 has invalid escapes in non-raw strings: a SyntaxWarning when it is first compiled.
    ignore:invalid escape sequence:SyntaxWarning
    # The trafilatura 1.11.0 CI job runs the default-mode tests too, and importing pyroid.trafilatura
    # there says compat="1.11.0" reproduces the installed release (test_version_mismatch.py checks it).
    ignore:pyroid\.trafilatura reproduces trafilatura 2\.3\.1, but trafilatura 1\.11\.0 is installed:pyroid.VersionMismatchWarning
# pytest-timeout: no single test may hang the run.
timeout = 300
markers =
    thread_unsafe: run single-threaded under pytest-run-parallel (subprocesses, global state, heavy memory).
