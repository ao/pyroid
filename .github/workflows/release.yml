# Build, test and publish pyroid: 24 wheels (8 platforms x 3 flavours) plus an sdist.
#
#   push to main      -> release-please opens/updates the release PR. When that PR is merged it tags vX.Y.Z,
#                        creates the GitHub Release, and this run builds, tests, attests and publishes to PyPI
#                        (after approval in the `pypi` environment).
#   pull_request      -> build and test everything; never publishes.
#   workflow_dispatch -> build and test; with `testpypi: true`, publish to TestPyPI (after approval in the
#                        `testpypi` environment). Use it for dry runs.
#
# Wheel flavours per platform (PyO3 features abi3-py311 + abi3t):
#   cp311-abi3        CPython 3.11+ with the GIL
#   cp314-cp314t      free-threaded CPython 3.14 (abi3t needs 3.15+)
#   cp315-abi3.abi3t  CPython 3.15+, with or without the GIL (PEP 803)
# Built in two maturin runs (`-i 3.11 3.14t`, then `-i 3.15`): with all three in one run maturin picks abi3t
# for the whole build and 3.11 gets a version-specific cp311-cp311 wheel instead of cp311-abi3.
#
# Profile-guided optimisation (PGO), on by default: each wheel job builds the three wheels instrumented
# (rustc -Cprofile-generate), runs bench/pgo_train.py with them on its own runner (natively, never under
# emulation: Linux glibc on the host, musllinux in Alpine, macOS and Windows on the host) for each
# interpreter in PGO_TRAIN_PYTHONS, merges the profiles with the llvm-profdata of the same rustc, and builds
# the published wheels with -Cprofile-use. The training inputs (bench/pgo_corpus.py: FineWeb and FineWeb-2
# rows that no benchmark times) are fetched once, by the pgo-corpus job. Every platform has its own native
# runner, so there are no universal2 macOS wheels: x86_64 and arm64 macOS wheels are built and trained
# separately. To build without PGO: `pgo: false` on a manual run, or set the repository variable
# PYROID_PGO=off (it also applies to release runs on push).
#
# Owner setup (trusted publishers, environments, release-please permissions): docs/RELEASING.md.
name: Release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      testpypi:
        description: Publish the built distributions to TestPyPI (dry run, needs approval in `testpypi`)
        type: boolean
        default: false
      pgo:
        description: Build the wheels with profile-guided optimisation (false gives plain release builds)
        type: boolean
        default: true

permissions: {}

concurrency:
  # PR runs are superseded by newer pushes; runs on main queue so a release is never cancelled midway.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

env:
  MATURIN_VERSION: v1.16.0
  UV_VERSION: "0.13.7"
  # Junk guard for the sdist (source + Cargo.lock + Unicode tables); raise it deliberately if needed.
  SDIST_MAX_BYTES: "5000000"
  # PGO on or off for this run (see the top of this file). The pgo-corpus job's `if` repeats the expression,
  # because a job-level `if` cannot read `env`.
  PGO: ${{ vars.PYROID_PGO != 'off' && (github.event_name != 'workflow_dispatch' || inputs.pgo) }}
  # The interpreters each wheel job trains with: one per wheel flavour, and 3.15 both with and without the GIL.
  PGO_TRAIN_PYTHONS: 3.12 3.14t 3.15 3.15t

jobs:
  release-please:
    name: release-please
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write # push the release-please branch, create the vX.Y.Z tag and the GitHub Release
      pull-requests: write # open and update the release PR
      issues: write # add and remove the "autorelease: ..." labels on the release PR
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      version: ${{ steps.release.outputs.version }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  pgo-corpus:
    name: PGO training inputs
    needs: release-please
    # As `wheels`, and only when PGO is on (the expression of env.PGO).
    if: >-
      ${{ !cancelled() && (github.event_name != 'push' || needs.release-please.outputs.release_created == 'true')
      && vars.PYROID_PGO != 'off' && (github.event_name != 'workflow_dispatch' || inputs.pgo) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read # checkout (bench/, parity/)
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false
      # FineWeb rows 10000:20000 and FineWeb-2 test rows 250:500 from the pinned revisions (each checked by the
      # content hash of the rows before it), and the fastText models (checked against bench/manifest.json).
      - name: Fetch the pinned training inputs (bench/pgo_corpus.py)
        run: uv run --project bench --frozen --no-default-groups python bench/pgo_corpus.py --out pgo-corpus
      - name: Upload the training inputs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pgo-corpus
          path: pgo-corpus/
          if-no-files-found: error
          retention-days: 1

  wheels:
    name: wheels (${{ matrix.platform.id }})
    needs: [release-please, pgo-corpus]
    # On push, build only for a release; on PRs and manual runs, always. pgo-corpus is skipped when PGO is off.
    if: >-
      ${{ !cancelled() && (github.event_name != 'push' || needs.release-please.outputs.release_created == 'true')
      && needs.pgo-corpus.result != 'failure' }}
    runs-on: ${{ matrix.platform.runner }}
    # A PGO job builds every wheel twice and trains in between.
    timeout-minutes: 150
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        platform:
          # Linux builds run in a container on a native runner (no QEMU): quay.io/pypa/manylinux2014_<arch>
          # for glibc, and maturin-action's ghcr.io/rust-cross/rust-musl-cross image for musllinux_1_2.
          - { id: manylinux-x86_64, runner: ubuntu-24.04, target: x86_64, manylinux: "2014" }
          - { id: manylinux-aarch64, runner: ubuntu-24.04-arm, target: aarch64, manylinux: "2014" }
          - { id: musllinux-x86_64, runner: ubuntu-24.04, target: x86_64, manylinux: musllinux_1_2, musl: true }
          - { id: musllinux-aarch64, runner: ubuntu-24.04-arm, target: aarch64, manylinux: musllinux_1_2, musl: true }
          # macos-15-intel is the last x86_64 macOS image (until August 2027); then cross-build on arm64, and
          # train the x86_64 wheels under Rosetta 2 or build them with `pgo: false`.
          - { id: macos-x86_64, runner: macos-15-intel, target: x86_64 }
          - { id: macos-arm64, runner: macos-15, target: aarch64 }
          - { id: windows-x64, runner: windows-2025, target: x64 }
          - { id: windows-arm64, runner: windows-11-arm, target: aarch64 }
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # macOS and Windows build on the host, so they need real interpreters. On Linux, maturin uses
      # /opt/python/* in the manylinux image (or its built-in interpreter configs in the musl cross image),
      # so these steps are skipped.
      - name: Set up Python 3.11
        id: py311
        if: runner.os != 'Linux'
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - name: Set up Python 3.14t
        id: py314t
        if: runner.os != 'Linux'
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14t"
      - name: Set up Python 3.15
        id: py315
        if: runner.os != 'Linux'
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"

      # One rustc for the whole job: "stable" is resolved once, so the instrumented build, llvm-profdata and
      # the final build use the same rustc and LLVM even if a Rust release lands while the job runs.
      - name: Pin the Rust toolchain for this job
        id: rust
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal --no-self-update
          version=$(rustc +stable --version | cut -d' ' -f2)
          rustup toolchain install "$version" --profile minimal --component llvm-tools --no-self-update
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # PGO step 1: the same two maturin runs as below (same arguments, so the same symbol names), instrumented.
      - name: Download the PGO training inputs
        if: env.PGO == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pgo-corpus
          path: pgo/corpus
      - name: Build instrumented cp311-abi3 and cp314t wheels (PGO)
        if: env.PGO == 'true'
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        env:
          RUSTFLAGS: -Cprofile-generate=${{ github.workspace }}/pgo/raw
        with:
          maturin-version: ${{ env.MATURIN_VERSION }}
          target: ${{ matrix.platform.target }}
          manylinux: ${{ matrix.platform.manylinux || 'auto' }}
          rust-toolchain: ${{ steps.rust.outputs.version }}
          args: >-
            --release --locked --out pgo/gen -i
            ${{ runner.os == 'Linux' && '3.11 3.14t' || format('{0} {1}', steps.py311.outputs.python-path, steps.py314t.outputs.python-path) }}
      - name: Build instrumented cp315-abi3.abi3t wheel (PGO)
        if: env.PGO == 'true'
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        env:
          RUSTFLAGS: -Cprofile-generate=${{ github.workspace }}/pgo/raw
        with:
          maturin-version: ${{ env.MATURIN_VERSION }}
          target: ${{ matrix.platform.target }}
          manylinux: ${{ matrix.platform.manylinux || 'auto' }}
          rust-toolchain: ${{ steps.rust.outputs.version }}
          args: >-
            --release --locked --out pgo/gen -i
            ${{ runner.os == 'Linux' && '3.15' || steps.py315.outputs.python-path }}

      # PGO step 2: train on this runner. The manylinux wheels run on the Ubuntu host; the musllinux ones in
      # Alpine (uv's image, as in the test job), with the checkout mounted so the raw profiles land in pgo/raw.
      - name: Set up uv (PGO training)
        if: env.PGO == 'true'
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false
      - name: Train the instrumented wheels (PGO)
        if: env.PGO == 'true' && !matrix.platform.musl
        run: |
          # shellcheck disable=SC2086 # a list of interpreters
          sh bench/pgo_train.sh pgo/gen pgo/corpus pgo/raw $PGO_TRAIN_PYTHONS
      - name: Train the instrumented wheels in Alpine (PGO)
        if: env.PGO == 'true' && matrix.platform.musl
        env:
          ALPINE_IMAGE: ghcr.io/astral-sh/uv:0.13.7-alpine@sha256:a788290ce829958f18bcea1dfd9fb5dcf4bfb22f6380b52c9322f9d91e86b117
        run: |
          docker run --rm -e PGO_TRAIN_PYTHONS -v "$PWD:/src" -w /src "$ALPINE_IMAGE" \
            sh -euc 'sh bench/pgo_train.sh pgo/gen pgo/corpus pgo/raw $PGO_TRAIN_PYTHONS'

      # PGO step 3: one profile for both maturin runs, merged by the llvm-profdata of the job's rustc.
      - name: Merge the profiles (PGO)
        if: env.PGO == 'true'
        env:
          TOOLCHAIN: ${{ steps.rust.outputs.version }}
          PLATFORM: ${{ matrix.platform.id }}
        run: |
          set -euo pipefail
          sysroot=$(rustc +"$TOOLCHAIN" --print sysroot)
          if command -v cygpath > /dev/null; then sysroot=$(cygpath -u "$sysroot"); fi
          host=$(rustc +"$TOOLCHAIN" -vV | sed -n 's/^host: //p')
          profdata="$sysroot/lib/rustlib/$host/bin/llvm-profdata"
          "$profdata" merge -o pgo/merged.profdata pgo/raw
          "$profdata" show pgo/merged.profdata > pgo/show.txt
          cat pgo/show.txt
          functions=$(sed -n 's/^Total functions: //p' pgo/show.txt)
          if [ "${functions:-0}" -lt 1000 ]; then
            echo "::error::the merged profile covers only ${functions:-0} functions"
            exit 1
          fi
          {
            echo "### PGO profile ($PLATFORM)"
            echo
            echo '```'
            echo "raw profiles: $(find pgo/raw -name '*.profraw' | wc -l | tr -d ' ') ($PGO_TRAIN_PYTHONS)"
            cat pgo/show.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # The published wheels: with -Cprofile-use when PGO is on, plain release builds when it is off.
      # Two maturin runs on purpose (same as ci.yml): maturin picks one stable-ABI family per run, and a
      # 3.15 interpreter in the same run switches it to abi3t, turning 3.11 into a cp311-cp311 wheel.
      - name: Build cp311-abi3 and cp314t wheels
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        env:
          RUSTFLAGS: ${{ env.PGO == 'true' && format('-Cprofile-use={0}/pgo/merged.profdata', github.workspace) || '' }}
        with:
          maturin-version: ${{ env.MATURIN_VERSION }}
          target: ${{ matrix.platform.target }}
          manylinux: ${{ matrix.platform.manylinux || 'auto' }} # ignored off Linux
          rust-toolchain: ${{ steps.rust.outputs.version }} # same toolchain in containers and on macOS/Windows hosts
          args: >-
            --release --locked --out dist -i
            ${{ runner.os == 'Linux' && '3.11 3.14t' || format('{0} {1}', steps.py311.outputs.python-path, steps.py314t.outputs.python-path) }}
      - name: Build cp315-abi3.abi3t wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        env:
          RUSTFLAGS: ${{ env.PGO == 'true' && format('-Cprofile-use={0}/pgo/merged.profdata', github.workspace) || '' }}
        with:
          maturin-version: ${{ env.MATURIN_VERSION }}
          target: ${{ matrix.platform.target }}
          manylinux: ${{ matrix.platform.manylinux || 'auto' }}
          rust-toolchain: ${{ steps.rust.outputs.version }}
          args: >-
            --release --locked --out dist -i
            ${{ runner.os == 'Linux' && '3.15' || steps.py315.outputs.python-path }}

      - name: Check this platform's wheels
        run: |
          set -euo pipefail
          ls -l dist
          for flavour in -cp311-abi3- -cp314-cp314t- -cp315-abi3.abi3t-; do
            n=$(find dist -maxdepth 1 -name "*${flavour}*.whl" | wc -l | tr -d ' ')
            if [ "$n" -ne 1 ]; then
              echo "::error::expected exactly one *${flavour}*.whl in dist/, found $n"
              exit 1
            fi
          done
          n=$(find dist -maxdepth 1 -name '*.whl' | wc -l | tr -d ' ')
          if [ "$n" -ne 3 ]; then
            echo "::error::expected 3 wheels in dist/, found $n"
            exit 1
          fi

      - name: Upload wheels
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-wheels-${{ matrix.platform.id }}
          path: dist/*.whl
          if-no-files-found: error
          compression-level: 0 # wheels are already zip files

  sdist:
    name: sdist
    needs: release-please
    if: ${{ !cancelled() && (github.event_name != 'push' || needs.release-please.outputs.release_created == 'true') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build sdist
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          maturin-version: ${{ env.MATURIN_VERSION }}
          command: sdist
          args: --out dist
      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false # no caches in a publishing workflow (cache poisoning)
      - name: Check sdist contents and size
        run: |
          set -euo pipefail
          n=$(find dist -maxdepth 1 -name 'pyroid-*.tar.gz' | wc -l | tr -d ' ')
          if [ "$n" -ne 1 ]; then
            echo "::error::expected exactly one pyroid-*.tar.gz in dist/, found $n"
            exit 1
          fi
          sdist=$(find dist -maxdepth 1 -name 'pyroid-*.tar.gz')
          tar -tzf "$sdist" > "$RUNNER_TEMP/sdist.txt"
          echo "$(wc -l < "$RUNNER_TEMP/sdist.txt") files, $(stat -c%s "$sdist") bytes"
          for f in PKG-INFO pyproject.toml Cargo.toml Cargo.lock LICENSE python/pyroid/__init__.py; do
            grep -qE "^[^/]+/${f}\$" "$RUNNER_TEMP/sdist.txt" || { echo "::error::sdist lacks $f"; exit 1; }
          done
          if grep -E '\.(so|pyd|dylib|dll|whl)$|^[^/]+/(bench|parity|benchmarks|target|dist|\.github)/' "$RUNNER_TEMP/sdist.txt"; then
            echo "::error::unexpected files in the sdist (listed above)"
            exit 1
          fi
          if [ "$(stat -c%s "$sdist")" -gt "$SDIST_MAX_BYTES" ]; then
            echo "::error::sdist is larger than $SDIST_MAX_BYTES bytes"
            exit 1
          fi
      - name: Build from the sdist and test it in a clean venv
        run: |
          set -euo pipefail
          venv="$RUNNER_TEMP/venv-sdist"
          uv venv --no-project --managed-python --python 3.12 "$venv"
          uv pip install --python "$venv" dist/pyroid-*.tar.gz
          uv pip install --python "$venv" --group test # pyproject.toml [dependency-groups] test
          cp -R python/tests "$RUNNER_TEMP/tests"
          cd "$RUNNER_TEMP"
          "$venv/bin/python" -c 'import pyroid, pyroid._pyroid as m; print(pyroid.__version__, m.__file__)'
          "$venv/bin/python" -m pytest -q tests
      - name: Upload sdist
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  test:
    name: test (${{ matrix.platform.id }}, ${{ matrix.python }})
    needs: wheels
    if: ${{ !cancelled() && needs.wheels.result != 'skipped' }}
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        platform:
          - { id: manylinux-x86_64, runner: ubuntu-24.04 }
          - { id: manylinux-aarch64, runner: ubuntu-24.04-arm }
          - { id: musllinux-x86_64, runner: ubuntu-24.04, musl: true }
          - { id: musllinux-aarch64, runner: ubuntu-24.04-arm, musl: true }
          - { id: macos-x86_64, runner: macos-15-intel }
          - { id: macos-arm64, runner: macos-15 }
          - { id: windows-x64, runner: windows-2025 }
          - { id: windows-arm64, runner: windows-11-arm }
        # 3.11 tests cp311-abi3, 3.14t tests cp314t, 3.15 and 3.15t both test the abi3t wheel.
        python: ["3.11", "3.14t", "3.15", "3.15t"]
    env:
      PY: ${{ matrix.python }}
    steps:
      - name: Check out (for the tests)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download this platform's wheels
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist-wheels-${{ matrix.platform.id }}
          path: dist
      - name: Select the wheel for this interpreter
        run: |
          set -euo pipefail
          case "$PY" in
            3.11) flavour=-cp311-abi3- ;;
            3.14t) flavour=-cp314-cp314t- ;;
            3.15 | 3.15t) flavour=-cp315-abi3.abi3t- ;;
            *) echo "::error::no wheel flavour for Python $PY"; exit 1 ;;
          esac
          n=$(find dist -maxdepth 1 -name "*${flavour}*.whl" | wc -l | tr -d ' ')
          if [ "$n" -ne 1 ]; then
            echo "::error::expected exactly one *${flavour}*.whl in dist/, found $n"
            exit 1
          fi
          wheel=$(find dist -maxdepth 1 -name "*${flavour}*.whl")
          echo "WHEEL=$wheel" >> "$GITHUB_ENV"
          echo "Testing $wheel on Python $PY"
          cp -R python/tests "${RUNNER_TEMP//\\//}/tests" # outside the checkout, so python/pyroid can't shadow the wheel

      - name: Set up uv
        if: ${{ !matrix.platform.musl }}
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false
      - name: Install the wheel into a clean venv and run the tests
        if: ${{ !matrix.platform.musl }}
        run: |
          set -euo pipefail
          tmp="${RUNNER_TEMP//\\//}"
          venv="$tmp/venv"
          uv venv --no-project --managed-python --python "$PY" "$venv"
          uv pip install --python "$venv" --no-index --no-deps "$WHEEL"
          uv pip install --python "$venv" --group test # pyproject.toml [dependency-groups] test
          if [ "$RUNNER_OS" = Windows ]; then python="$venv/Scripts/python.exe"; else python="$venv/bin/python"; fi
          cd "$tmp"
          # PYTHON_GIL is deliberately unset: PYTHON_GIL=0 would hide a module that re-enables the GIL.
          "$python" -W error::RuntimeWarning -c '
          import sys, sysconfig, pyroid, pyroid._pyroid as core
          print(pyroid.__version__, core.__file__, sys.version, sep="\n")
          assert "site-packages" in core.__file__, "pyroid was not imported from the installed wheel"
          if sysconfig.get_config_var("Py_GIL_DISABLED"):
              assert not sys._is_gil_enabled(), "importing pyroid re-enabled the GIL"
          '
          "$python" -m pytest -q tests

      - name: Install the wheel into a clean venv in Alpine and run the tests
        if: ${{ matrix.platform.musl }}
        env:
          # uv's Alpine image (Alpine 3.23), pinned by its multi-arch index digest (linux/amd64 + linux/arm64).
          # uv installs dynamically linked musl CPython builds, including 3.14t/3.15t.
          ALPINE_IMAGE: ghcr.io/astral-sh/uv:0.13.7-alpine@sha256:a788290ce829958f18bcea1dfd9fb5dcf4bfb22f6380b52c9322f9d91e86b117
        run: |
          set -euo pipefail
          docker run --rm -e PY -e WHEEL -v "$PWD/dist:/dist:ro" -v "$RUNNER_TEMP/tests:/src/tests:ro" \
            -v "$PWD/pyproject.toml:/src/pyproject.toml:ro" "$ALPINE_IMAGE" sh -euc '
              uv venv --no-project --managed-python --python "$PY" /venv
              uv pip install --python /venv --no-index --no-deps "/$WHEEL"
              uv pip install --python /venv --group /src/pyproject.toml:test
              cp -R /src/tests /tmp/tests && cd /tmp
              /venv/bin/python -W error::RuntimeWarning -c "
          import sys, sysconfig, pyroid, pyroid._pyroid as core
          print(pyroid.__version__, core.__file__, sys.version, sep=chr(10))
          assert \"site-packages\" in core.__file__, \"pyroid was not imported from the installed wheel\"
          if sysconfig.get_config_var(\"Py_GIL_DISABLED\"):
              assert not sys._is_gil_enabled(), \"importing pyroid re-enabled the GIL\"
          "
              /venv/bin/python -m pytest -q tests
            '

  dist:
    name: check distributions
    needs: [release-please, wheels, sdist, test]
    if: ${{ !cancelled() && needs.wheels.result == 'success' && needs.sdist.result == 'success' && needs.test.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions: {}
    steps:
      - name: Download all distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false
      - name: Check the wheel set, versions and metadata
        env:
          RELEASE_VERSION: ${{ needs.release-please.outputs.version }}
        run: |
          set -euo pipefail
          uv run --no-project --managed-python --python 3.13 --with 'packaging>=25' python - <<'EOF'
          import os
          import re
          import sys
          from pathlib import Path

          from packaging.utils import parse_sdist_filename, parse_wheel_filename
          from packaging.version import Version

          FLAVOURS = ("cp311-abi3", "cp314-cp314t", "cp315-abi3.abi3t")
          PLATFORMS = {
              "manylinux2014 x86_64": r"manylinux_2_17_x86_64\.manylinux2014_x86_64",
              "manylinux2014 aarch64": r"manylinux_2_17_aarch64\.manylinux2014_aarch64",
              "musllinux_1_2 x86_64": r"musllinux_1_2_x86_64",
              "musllinux_1_2 aarch64": r"musllinux_1_2_aarch64",
              "macOS x86_64": r"macosx_\d+_\d+_x86_64",
              "macOS arm64": r"macosx_\d+_\d+_arm64",
              "Windows x64": r"win_amd64",
              "Windows arm64": r"win_arm64",
          }
          files = sorted(p.name for p in Path("dist").iterdir())
          errors, versions, seen = [], set(), {}
          sdists = [f for f in files if f.endswith(".tar.gz")]
          for f in files:
              if f.endswith(".whl"):
                  name, version, _, _ = parse_wheel_filename(f)
                  parts = f[: -len(".whl")].split("-")
                  flavour = "-".join(parts[2:4])
                  platform = next((k for k, rx in PLATFORMS.items() if re.fullmatch(rx, parts[-1])), None)
                  if name != "pyroid" or len(parts) != 5 or flavour not in FLAVOURS or platform is None:
                      errors.append(f"unexpected wheel: {f}")
                      continue
                  if (platform, flavour) in seen:
                      errors.append(f"two {platform} {flavour} wheels: {seen[platform, flavour]}, {f}")
                  seen[platform, flavour] = f
                  versions.add(version)
              elif f in sdists:
                  name, version = parse_sdist_filename(f)
                  versions.add(version)
              else:
                  errors.append(f"unexpected file: {f}")
          errors += [f"missing wheel: {p} {fl}" for p in PLATFORMS for fl in FLAVOURS if (p, fl) not in seen]
          if len(sdists) != 1:
              errors.append(f"expected one sdist, found {sdists}")
          if len(versions) != 1:
              errors.append(f"mixed versions: {sorted(map(str, versions))}")
          release = os.environ.get("RELEASE_VERSION")
          if release and versions != {Version(release)}:
              errors.append(f"distributions are {sorted(map(str, versions))}, release-please says {release}")
          print(f"{len(seen)} wheels + {len(sdists)} sdist, version(s) {sorted(map(str, versions))}")
          for e in errors:
              print(f"::error::{e}")
          sys.exit(1 if errors else 0)
          EOF
          uvx --managed-python --python 3.13 twine@7.0.0 check --strict dist/*
          {
            echo "### Distributions"
            echo
            echo '```'
            ls -l dist
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload the checked set
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/*
          if-no-files-found: error
          compression-level: 0

  publish-testpypi:
    name: publish to TestPyPI
    needs: dist
    if: ${{ !cancelled() && needs.dist.result == 'success' && github.event_name == 'workflow_dispatch' && inputs.testpypi }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: testpypi
      url: https://test.pypi.org/project/pyroid/
    permissions:
      id-token: write # OIDC token for TestPyPI Trusted Publishing and the PEP 740 attestations
    steps:
      - name: Download the checked distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          repository-url: https://test.pypi.org/legacy/
          print-hash: true

  attest:
    name: attest build provenance
    needs: [release-please, dist]
    if: ${{ !cancelled() && needs.dist.result == 'success' && needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      id-token: write # OIDC identity for the Sigstore signing certificate
      attestations: write # store the provenance attestations in this repository
    steps:
      - name: Download the checked distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - name: Attest build provenance (verify with `gh attestation verify <file> --repo ao/pyroid`)
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/*

  publish-pypi:
    name: publish to PyPI
    needs: [release-please, dist, attest]
    if: ${{ !cancelled() && needs.attest.result == 'success' && needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: pypi
      url: https://pypi.org/project/pyroid/
    permissions:
      id-token: write # OIDC token for PyPI Trusted Publishing and the PEP 740 attestations
    steps:
      - name: Download the checked distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - name: Publish to PyPI (PEP 740 attestations are generated by default)
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          print-hash: true
