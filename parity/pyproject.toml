[project]
name = "pyroid-parity"
version = "0.1.0"
description = "Implementation-agnostic parity suites for pyroid: ftfy, fastText, datatrove filters and MinHash dedup."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
# Core deps install on every interpreter pyroid targets (3.12 ... 3.15t): suites compare a candidate against
# pinned references stored in /data, and against the live oracle wherever the oracle installs.
dependencies = [
    "ftfy==6.3.1",
    "pytest>=9.2",
    "pytest-timeout>=2.4",
    "hypothesis>=6.170",
    "pyarrow>=26",
    "numpy>=2.3",
]

[dependency-groups]
# Live oracles + reference generation. fasttext-predict ships no wheel past cp313/cp313t (see README).
oracle = [
    "datatrove==0.10.1",
    "spacy==3.8.18",
    "tokenizers>=0.22",
    "regex>=2024.11",
    "xxhash>=3.5,<4",
    "fasttext-predict==0.9.2.4; python_version < '3.14'",
]
dev = [{ include-group = "oracle" }, "jsonschema>=4.25", "ruff>=0.17.3"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pyroid_parity"]

[tool.uv]
default-groups = ["dev"]

[tool.pytest]
minversion = "9.0"
testpaths = ["tests"]
addopts = ["-ra", "-p", "pyroid_parity.plugin"]
strict = true
filterwarnings = ["error", "ignore::DeprecationWarning:datatrove.*"]
timeout = "600"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
extend-select = ["I", "B", "UP", "PERF", "PT", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Mojibake, confusables, control and bidi characters are the test data here.
"pyroid_parity/{refs,strategies}.py" = ["RUF001", "RUF003", "PLE2502", "PLE2515"]
"tests/**" = ["RUF001", "RUF003", "RUF012", "PLE2502", "PLE2515", "PT018"]
