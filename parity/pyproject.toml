[project]
name = "pyroid-parity"
version = "0.1.0"
description = "Implementation-agnostic parity suites for pyroid: ftfy, fastText, datatrove filters, MinHash dedup and eval metrics."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
# Core deps install on every interpreter pyroid targets (3.12 ... 3.15t): suites compare a candidate against
# pinned references stored in /data, and against the live oracle wherever the oracle installs.
dependencies = [
    "ftfy==6.3.1",
    "json-repair==0.64.5",
    "pytest>=9.2",
    "pytest-timeout>=2.4",
    "hypothesis>=6.170",
    "pyarrow>=26",
    "numpy>=2.3",
    # metrics suite oracles: pure Python (+ numpy, regex, lxml wheels), so they install on 3.12 ... 3.15t.
    # sacrebleu is only imported on GIL builds: it loads lxml, which re-enables the GIL on free-threaded ones.
    "rouge-score==0.1.2",
    "nltk==3.10.4",
    "sacrebleu==2.6.0",
    # datasketch suite oracle (MIT; numpy + scipy wheels on 3.12 ... 3.15t).
    "datasketch==2.0.0",
]

[dependency-groups]
# Live oracles + reference generation. fasttext-predict ships no wheel past cp313/cp313t (see README).
oracle = [
    "datatrove==0.10.1",
    "spacy==3.8.18",
    "tokenizers>=0.22",
    "regex>=2024.11",
    "xxhash>=3.5,<4",
    # datatrove's Chinese tokenizer (SpaCyTokenizer("zh")) and the reference of the jieba suite.
    "jieba==0.42.1",
    "fasttext-predict==0.9.2.4; python_version < '3.14'",
    # What datatrove 0.10.1 needs but doesn't install for the steps tests/test_filters_more.py runs live: its
    # `processing` extra for URLFilter (the versions the URLFilter tests were verified with), and aiohttp for fsspec's HTTP download of
    # C4BadWordsFilter's word lists.
    "tldextract==5.4.0",
    "pyahocorasick==2.3.1",
    "fasteners>=0.19",
    "aiohttp>=3.11",
]
# datatrove's Japanese tokenizer (SpaCyTokenizer("ja")) and the SudachiDict pyroid reads for jpn_Jpan (a 77 MB
# wheel): only the filters and dedup legs install it (`--group ja`); without it the Japanese checks skip.
ja = ["sudachipy==0.7.0", "sudachidict-core==20261015"]
# The trafilatura suite's oracles, one group per mode pyroid.trafilatura reproduces (`compat=`). They conflict
# ([tool.uv] conflicts below): `trafilatura` (2.3.1) is a default group, and the 1.11.0 mode runs with
# `--no-group trafilatura --group trafilatura111`. Pure Python except lxml, which has cp314t/cp315t wheels.
trafilatura = ["trafilatura==2.3.1", "lxml==6.1.3", "justext==3.0.2"]
# Mode 1.11.0: what a fresh `pip install datatrove[processing]==0.10.1` resolves (trafilatura<1.12), pinned exactly.
trafilatura111 = [
    "trafilatura==1.11.0",
    "lxml==6.1.3",
    "justext==3.0.2",
    "lxml-html-clean==0.4.6",
    "charset-normalizer==3.5.2",
    "courlan==1.4.0",
    "htmldate==1.11.0",
]
# What pyroid_parity.trafilatura_scale needs besides an oracle group (Common Crawl slices through datatrove's
# WarcReader and URLFilter), at the versions bench/pyproject.toml pins for fetch.py: `uv run --group cc`.
cc = [
    "datatrove==0.10.1",
    "warcio==1.8.2",
    "faust-cchardet==3.2.0",
    "python-magic==0.4.27",
    "tldextract==5.4.0",
    "pyahocorasick==2.3.1",
    "fasteners>=0.19",
]
dev = [{ include-group = "oracle" }, "jsonschema>=4.25", "ruff>=0.17.3"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pyroid_parity"]

[tool.uv]
default-groups = ["dev", "trafilatura"]
conflicts = [[{ group = "trafilatura" }, { group = "trafilatura111" }]]

[tool.pytest]
minversion = "9.0"
testpaths = ["tests"]
addopts = ["-ra", "-p", "pyroid_parity.plugin"]
strict = true
filterwarnings = [
    "error",
    "ignore::DeprecationWarning:datatrove.*",
    # datatrove's URLFilter extracts its block lists with tarfile and no filter. CPython 3.12.3
    # (the ubuntu-24.04 runners' python3.12) attributes that warning to tarfile, not the caller.
    "ignore:Python 3.14 will, by default, filter extracted tar archives:DeprecationWarning:tarfile",
    # jieba 0.42.1 has invalid escapes in non-raw strings ("\."): a SyntaxWarning when it is compiled.
    "ignore:invalid escape sequence:SyntaxWarning",
]
timeout = "600"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
extend-select = ["I", "B", "UP", "PERF", "PT", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Mojibake, confusables, control and bidi characters are the test data here.
"pyroid_parity/{refs,strategies}.py" = ["RUF001", "RUF003", "PLE2502", "PLE2515"]
"tests/**" = ["RUF001", "RUF003", "RUF012", "PLE2502", "PLE2515", "PT018"]
