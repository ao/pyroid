[workspace]
resolver = "3"
# Listed explicitly (no globs): release tooling reads member paths literally.
members = ["crates/pyroid-core", "crates/pyroid-py"]
# `cargo test` / `cargo build` at the root touch only the pure-Rust core; the
# extension module is built by maturin (see pyproject.toml).
default-members = ["crates/pyroid-core"]

[workspace.package]
# Single source of the version. pyproject.toml reads it via `dynamic = ["version"]`
# (maturin converts SemVer to PEP 440, e.g. 1.0.0-dev -> 1.0.0.dev0).
version = "1.0.0-dev"
edition = "2024"
rust-version = "1.85"
license = "MIT AND Apache-2.0 AND Unicode-3.0 AND ISC"
authors = ["Andrew Odendaal"]
repository = "https://github.com/ao/pyroid"

[workspace.dependencies]
pyo3 = "0.30.1"
rayon = "1.12.0"
simdutf8 = "0.1.5"
pyroid-core = { path = "crates/pyroid-core" }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
dbg_macro = "deny"
todo = "deny"
print_stdout = "deny"
print_stderr = "deny"
# Every `unsafe` block carries a `// SAFETY:` comment, and holds one unsafe operation.
undocumented_unsafe_blocks = "deny"
multiple_unsafe_ops_per_block = "deny"
# Justified pedantic allows:
# - the crates are internal (publish = false); error semantics are documented on
#   the Python-facing functions and in the .pyi stubs, not in rustdoc sections.
missing_errors_doc = "allow"
missing_panics_doc = "allow"
# - small pure kernels; #[must_use] on every one is noise.
must_use_candidate = "allow"
# - pyo3 extractors take arguments by value (e.g. `TextInput`, `Threads`).
needless_pass_by_value = "allow"
# - `text::TextError`-style names read better than bare `Error` at call sites.
module_name_repetitions = "allow"
# - prose names products (CPython, PyO3, PyCapsule), which aren't code items.
doc_markdown = "allow"

[profile.release]
# "unwind" is required: PyO3 turns Rust panics into PanicException only when
# they unwind. "abort" would kill the Python interpreter.
panic = "unwind"
lto = "fat"
codegen-units = 1
strip = true

# `cargo build --profile profiling` / `maturin build --profile profiling`:
# release codegen with symbols, for perf and cargo-bloat.
[profile.profiling]
inherits = "release"
strip = "none"
debug = "line-tables-only"
