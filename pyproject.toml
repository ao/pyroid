[build-system]
requires = ["maturin>=1.16,<2.0"]
build-backend = "maturin"

[project]
name = "pyroid"
# Single source: [workspace.package].version in the root Cargo.toml.
dynamic = ["version"]
description = "Rust-fast text cleaning for LLM datasets (1.0 rewrite in progress)"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Andrew Odendaal" }]
keywords = ["llm", "dataset", "text-cleaning", "rust", "pyo3"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Programming Language :: Python :: Free Threading :: 2 - Beta",
  "Programming Language :: Python :: Implementation :: CPython",
  "Programming Language :: Rust",
  "Topic :: Text Processing",
  "Typing :: Typed",
]
# No runtime dependencies.
dependencies = []

[project.optional-dependencies]
# pyroid.fasttext returns numpy arrays (as fastText does); it raises a clear
# ImportError without numpy.
fasttext = ["numpy>=1.26"]

[project.urls]
Homepage = "https://github.com/ao/pyroid"
Repository = "https://github.com/ao/pyroid"
Issues = "https://github.com/ao/pyroid/issues"
Changelog = "https://github.com/ao/pyroid/blob/main/CHANGELOG.md"

[dependency-groups]
# pyarrow is a test-only dependency (Arrow interop tests); pyroid itself has no
# runtime dependencies. The Arrow tests also run without it, against pyroid's
# own Arrow exporter.
test = [
  "pytest>=9",
  "packaging>=24",
  "hypothesis>=6.170",
  "pytest-timeout>=2.4",
  "pytest-run-parallel>=0.10",
  "pyarrow>=18",
  # The reference implementation for pyroid.ftfy's parity tests.
  "ftfy==6.3.1",
  # pyroid.fasttext needs numpy; fasttext-predict is its reference (no wheels past cp313).
  "numpy>=1.26",
  "fasttext-predict==0.9.2.4; python_version < '3.14'",
]
# Same pins as .pre-commit-config.yaml (prek runs ruff and mypy from there).
lint = ["ruff==0.17.3", "mypy==2.4.1", "prek==0.5.10"]
dev = ["maturin>=1.16,<2.0", { include-group = "test" }, { include-group = "lint" }]

[tool.maturin]
manifest-path = "crates/pyroid-py/Cargo.toml"
module-name = "pyroid._pyroid"
python-source = "python"
locked = true
strip = true
# Ship the tests in the sdist (for downstream packagers), not in wheels.
include = [{ path = "python/tests/**/*.py", format = "sdist" }]
# Keep the sdist small: crate sources, Cargo.lock, pyproject, README, LICENSE,
# python/pyroid and python/tests. Never ship locally built extensions.
exclude = [
  { path = "python/pyroid/*.so", format = ["sdist", "wheel"] },
  { path = "python/pyroid/*.pyd", format = ["sdist", "wheel"] },
  { path = "python/pyroid/*.dylib", format = ["sdist", "wheel"] },
  { path = "python/**/__pycache__/**", format = ["sdist", "wheel"] },
  { path = "bench/**", format = "sdist" },
  { path = "parity/**", format = "sdist" },
  { path = "docs/**", format = "sdist" },
  { path = ".github/**", format = "sdist" },
]

[tool.pytest]
# A bare `pytest` at the root runs pyroid's own tests only. parity/ has its own pytest config (it
# needs `-p pyroid_parity.plugin`) and bench/ has no tests; mypy `files` below skip both too, and
# ruff lints them with their own [tool.ruff] (the nearest pyproject.toml wins).
testpaths = ["python/tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["python"]

[tool.ruff.lint]
# An explicit list (not ruff's default set) so a ruff upgrade never adds rules silently.
select = [
  "E", "W", "F", "I", "B", "UP", "PYI", "PT", "RUF",
  "C4",   # comprehensions
  "D",    # docstrings: the published package only (see per-file-ignores)
  "N",    # pep8-naming
  "PERF", # performance anti-patterns
  "PIE",
  "SIM",
  "T20",  # no print() in library code
]
ignore = [
  "D105",   # magic methods are documented by their class
  "D107",   # __init__ is documented in the class docstring
  "PYI021", # docstrings in .pyi stubs are intentional: the API docs are built from them
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"!python/pyroid/**" = ["D"]
# Dev scripts and the benchmark/parity harnesses report on stdout. bench/ and parity/ are linted with
# their own [tool.ruff]; this entry covers the ftfy table generator, oracle and benchmark scripts.
"{python/scripts,bench,parity}/**" = ["T20"]
"crates/pyroid-core/src/ftfy/generate_tables.py" = ["T20"]
"crates/pyroid-core/tests/ftfy_data/*.py" = ["T20"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "python"
# Tests are type-checked against the stubs too (needs pytest, packaging and hypothesis
# installed; the prek `mypy` hook provides them).
files = ["python/pyroid", "python/tests"]

[[tool.mypy.overrides]]
# pyarrow 26 ships neither py.typed nor stubs.
module = ["pyarrow", "pyarrow.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# polars is typed, but optional in the tests: polars-runtime-32 2.1.0 has no free-threaded
# wheels, so it is only installed on GIL builds and absent from the mypy hook.
module = ["polars", "polars.*"]
ignore_missing_imports = true
