[build-system]
requires = ["maturin>=1.16,<2.0"]
build-backend = "maturin"

[project]
name = "pyroid"
# Single source: [workspace.package].version in the root Cargo.toml.
dynamic = ["version"]
description = "Rust implementations of ftfy, fastText inference, datatrove's filters and dedup, Trafilatura, rouge-score, sacrebleu and json_repair, with the same API and output"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT AND Apache-2.0 AND BSD-2-Clause AND BSD-3-Clause AND ISC AND PSF-2.0 AND Unicode-3.0"
license-files = ["LICENSE", "LICENSES/*", "NOTICE"]
authors = [{ name = "Andrew Odendaal" }]
keywords = ["llm", "dataset", "text-cleaning", "rust", "pyo3"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Programming Language :: Python :: Free Threading :: 2 - Beta",
  "Programming Language :: Python :: Implementation :: CPython",
  "Programming Language :: Rust",
  "Topic :: Text Processing",
  "Typing :: Typed",
]
# No runtime dependencies.
dependencies = []

[project.optional-dependencies]
# pyroid.fasttext returns numpy arrays (as fastText does); without numpy it raises a
# ModuleNotFoundError (name="numpy") with this install hint.
fasttext = ["numpy>=1.26"]
# pyroid.datasketch keeps datasketch's numpy arrays (hashvalues, permutations); without numpy it
# raises a ModuleNotFoundError (name="numpy") with this install hint.
datasketch = ["numpy>=1.26"]
# The `pyroid` command line (Parquet/JSONL streaming, the FineWeb recipe) and
# pyroid.integrations.recipes.
cli = ["pyarrow>=18", "numpy>=1.26"]
# pyroid.integrations.datatrove: drop-in steps; they reproduce datatrove 0.10.1. regex and
# tokenizers: datatrove.pipeline.filters imports them, but datatrove does not declare them. orjson:
# datatrove's JsonlWriter and JsonlReader need it (datatrove's `io` extra, with no floor); 3.2 added
# the OPT_APPEND_NEWLINE its writer passes.
datatrove = ["datatrove>=0.10.1", "regex", "tokenizers", "numpy>=1.26", "orjson>=3.2"]
# pyroid.integrations.hf: Hugging Face datasets helpers.
hf = ["datasets>=3", "pyarrow>=18", "numpy>=1.26"]
# datatrove's page decoding in pyroid.warc.iter_documents/iter_batches, the WarcReader drop-in and
# `pyroid clean --recipe fineweb-warc`: faust-cchardet guesses the charset of pages that are not
# UTF-8, python-magic (with the libmagic system library) types records that have no
# WARC-Identified-Payload-Type. Both are imported only when a record needs them, as datatrove
# does; pyroid.warc.ArchiveIterator needs neither.
warc = ["faust-cchardet", "python-magic"]

[project.scripts]
pyroid = "pyroid.cli:main"

[project.urls]
Homepage = "https://github.com/ao/pyroid"
Repository = "https://github.com/ao/pyroid"
Issues = "https://github.com/ao/pyroid/issues"
Changelog = "https://github.com/ao/pyroid/blob/main/CHANGELOG.md"

[dependency-groups]
# pyarrow is a test-only dependency (Arrow interop tests); pyroid itself has no
# runtime dependencies. The Arrow tests also run without it, against pyroid's
# own Arrow exporter. pyarrow and fasttext-predict publish no Windows ARM64 wheels,
# so they are left out there (release.yml tests the windows-arm64 wheels).
test = [
  "pytest>=9",
  "packaging>=24",
  "hypothesis>=6.170",
  "pytest-timeout>=2.4",
  "pytest-run-parallel>=0.10",
  "pyarrow>=18; sys_platform != 'win32' or platform_machine != 'ARM64'",
  # The reference implementation for pyroid.ftfy's parity tests.
  "ftfy==6.3.1",
  # pyroid.fasttext needs numpy; fasttext-predict is its reference (no wheels past cp313).
  "numpy>=1.26",
  "fasttext-predict==0.9.2.4; python_version < '3.14' and (sys_platform != 'win32' or platform_machine != 'ARM64')",
  # The reference for pyroid.translit.anyascii (ISC). Unidecode (GPL) is never a
  # default dependency: it is only a black-box oracle in an opt-in CI job.
  "anyascii==0.3.3",
  # The references for pyroid.metrics (versions as in parity/uv.lock): rouge-score and the NLTK it scores
  # with (Porter stemmer, sent_tokenize), and the regex release whose Unicode tables pyroid.metrics.sacrebleu's
  # `intl` tokenizer reproduces. sacrebleu itself is in `test-gil`.
  "rouge-score==0.1.2",
  "nltk==3.10.4",
  "regex==2026.9.29",
  # The reference for pyroid.json_repair's parity tests (MIT, pure Python).
  "json-repair==0.64.5",
  # The reference for pyroid.datasketch's parity tests (MIT; pulls numpy and scipy).
  "datasketch==2.0.0",
  # The reference for pyroid.jieba and for datatrove's Chinese tokenizer (MIT, pure Python).
  "jieba==0.42.1",
  # The reference for pyroid.warc (Apache-2.0, pure Python).
  "warcio==1.8.2",
]
# GIL builds only. `import sacrebleu` loads lxml, which re-enables the GIL on free-threaded CPython, and no
# PEP 508 marker can tell a free-threaded interpreter apart, so CI installs this group only on GIL builds
# (`uv pip install --group test-gil`); on free-threaded builds the sacrebleu reference tests skip.
test-gil = [
  "sacrebleu==2.6.0",
  # The reference for pyroid.trafilatura (Apache-2.0) and the lxml and jusText releases it reproduces.
  "trafilatura==2.3.1",
  "lxml==6.1.3",
  "justext==3.0.2",
  # warcio decodes `Content-Encoding: br` only with brotlicffi installed (pyroid.warc follows it); cffi
  # wheels for free-threaded builds are not guaranteed, so GIL builds only.
  "brotlicffi==1.2.1.0",
]
# The reference for pyroid.trafilatura's compat="1.11.0" mode: trafilatura 1.11.0 as
# datatrove[processing]==0.10.1 resolves it. GIL builds only (lxml), and instead of test-gil's
# trafilatura 2.3.1, never with it: `uv pip install --group test-trafilatura-111`.
test-trafilatura-111 = [
  "trafilatura==1.11.0",
  "lxml==6.1.3",
  "justext==3.0.2",
  "lxml-html-clean==0.4.6",
  "charset-normalizer==3.5.2",
  "courlan==1.4.0",
  "htmldate==1.11.0",
]
# Same pins as .pre-commit-config.yaml (prek runs ruff and mypy from there).
lint = ["ruff==0.17.3", "mypy==2.4.1", "prek==0.5.10"]
dev = ["maturin>=1.16,<2.0", { include-group = "test" }, { include-group = "lint" }]
# The docs site (mkdocs.yml; .github/workflows/docs.yml): Zensical builds and publishes it, and
# mkdocs-material's `mkdocs build --strict` is the link, anchor and nav check. mkdocstrings reads the
# .pyi stubs statically, so no Rust build is needed; ruff formats the signatures it renders.
docs = [
  "zensical==0.0.74",
  "mkdocs-material==9.8.0",
  "mkdocstrings-python==2.0.10",
  "ruff==0.17.3",
]

[tool.maturin]
manifest-path = "crates/pyroid-py/Cargo.toml"
module-name = "pyroid._pyroid"
python-source = "python"
locked = true
strip = true
# Ship the tests in the sdist (for downstream packagers), not in wheels.
include = [{ path = "python/tests/**/*.py", format = "sdist" }]
# Keep the sdist small: crate sources, Cargo.lock, pyproject, README, LICENSE,
# python/pyroid and python/tests. Never ship locally built extensions.
exclude = [
  { path = "python/pyroid/*.so", format = ["sdist", "wheel"] },
  { path = "python/pyroid/*.pyd", format = ["sdist", "wheel"] },
  { path = "python/pyroid/*.dylib", format = ["sdist", "wheel"] },
  { path = "python/**/__pycache__/**", format = ["sdist", "wheel"] },
  { path = "bench/**", format = "sdist" },
  { path = "parity/**", format = "sdist" },
  { path = "docs/**", format = "sdist" },
  { path = ".github/**", format = "sdist" },
  # Black-box comparison against GPL Unidecode: not shipped.
  { path = "python/tests/test_translit_unidecode.py", format = "sdist" },
]

[tool.pytest]
# A bare `pytest` at the root runs pyroid's own tests only. parity/ has its own pytest config (it
# needs `-p pyroid_parity.plugin`) and bench/ has no tests; mypy `files` below skip both too, and
# ruff lints them with their own [tool.ruff] (the nearest pyproject.toml wins).
testpaths = ["python/tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["python"]

[tool.ruff.lint]
# An explicit list (not ruff's default set) so a ruff upgrade never adds rules silently.
select = [
  "E", "W", "F", "I", "B", "UP", "PYI", "PT", "RUF",
  "C4",   # comprehensions
  "D",    # docstrings: the published package only (see per-file-ignores)
  "N",    # pep8-naming
  "PERF", # performance anti-patterns
  "PIE",
  "SIM",
  "T20",  # no print() in library code
]
ignore = [
  "D105",   # magic methods are documented by their class
  "D107",   # __init__ is documented in the class docstring
  "PYI021", # docstrings in .pyi stubs are intentional: the API docs are built from them
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"!python/pyroid/**" = ["D"]
# Dev scripts and the benchmark/parity harnesses report on stdout. bench/ and parity/ are linted with
# their own [tool.ruff]; this entry covers the ftfy table generator, oracle and benchmark scripts.
"{python/scripts,bench,parity}/**" = ["T20"]
"crates/pyroid-core/src/ftfy/generate_tables.py" = ["T20"]
"crates/pyroid-core/tests/ftfy_data/*.py" = ["T20"]
"crates/pyroid-core/tests/datasketch_data/*.py" = ["T20"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "python"
# Tests are type-checked against the stubs too (needs pytest, packaging and hypothesis
# installed; the prek `mypy` hook provides them).
files = ["python/pyroid", "python/tests"]

[[tool.mypy.overrides]]
# pyarrow 26 ships neither py.typed nor stubs.
module = ["pyarrow", "pyarrow.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# datasketch 2.0.0 (the reference for pyroid.datasketch's tests) ships neither py.typed nor stubs.
module = ["datasketch", "datasketch.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# polars is typed, but optional in the tests: polars-runtime-32 2.1.0 has no free-threaded
# wheels, so it is only installed on GIL builds and absent from the mypy hook.
module = ["polars", "polars.*"]
ignore_missing_imports = true
